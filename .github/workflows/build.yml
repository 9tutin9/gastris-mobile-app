name: Build GastrIS Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # ať GITHUB_TOKEN může vytvořit/nahrát release v TOMTO repu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Legacy balíček 'tools' Google ze SDK odstranil → default akce na něm padá.
          # cmdline-tools instaluje akce sama; stačí platform-tools (zbytek dotáhne Gradle).
          packages: 'platform-tools'

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate app launcher icons (SKYsoftware)
        # Jednotná ikona "S" (SKYsoftware) z assets/ (icon-only + adaptivní
        # foreground/background) → Android mipmapy + adaptivní ikona. Bez tohoto
        # by appka jela s default Capacitor ikonou. continue-on-error: kdyby
        # generátor zlobil, build (a scanner fix) stejně projde se starou ikonou.
        continue-on-error: true
        run: npx @capacitor/assets@3 generate --android --assetPath assets

      - name: Inject native GastrisServer plugin + custom MainActivity
        # Univerzální APK: adresa kasy NENÍ zapečená. Launcher (www) po naskenování
        # párovacího QR zavolá GastrisServer.setServer({url,claimUrl}) → uloží + restart.
        # MainActivity při PRVNÍM startu po spárování načte claim URL (s ?wt tokenem →
        # zařízení se přihlásí), při dalších restartech čistý origin (bez tokenu →
        # auto-přihlášení z uloženého JWT). Nativní bridge (ML Kit scanner párovacího
        # QR) jede jen na server.url originu, proto ho nastavíme jako config.
        run: |
          PKG_DIR=android/app/src/main/java/cz/gastris/app
          mkdir -p "$PKG_DIR"

          cat > "$PKG_DIR/GastrisServer.java" <<'JAVAEOF'
          package cz.gastris.app;

          import android.content.Context;
          import android.content.SharedPreferences;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "GastrisServer")
          public class GastrisServer extends Plugin {

              private SharedPreferences prefs() {
                  return getContext().getSharedPreferences("gastris", Context.MODE_PRIVATE);
              }

              @PluginMethod
              public void setServer(PluginCall call) {
                  String url = call.getString("url");
                  if (url == null || url.trim().isEmpty()) {
                      call.reject("url chybi");
                      return;
                  }
                  // claimUrl = jednorázová adresa s ?wt tokenem (první přihlášení zařízení);
                  // když chybí, použij base. Base (url) je autoritativní pro restarty.
                  String claim = call.getString("claimUrl");
                  if (claim == null || claim.trim().isEmpty()) claim = url;
                  prefs().edit()
                      .putString("server_url", url.trim())
                      .putString("claim_url", claim.trim())
                      .putBoolean("just_paired", true)
                      .commit();
                  call.resolve();
                  getActivity().runOnUiThread(() -> getActivity().recreate());
              }

              @PluginMethod
              public void clearServer(PluginCall call) {
                  prefs().edit().remove("server_url").remove("claim_url").commit();
                  call.resolve();
                  getActivity().runOnUiThread(() -> getActivity().recreate());
              }

              @PluginMethod
              public void getServer(PluginCall call) {
                  JSObject ret = new JSObject();
                  ret.put("url", prefs().getString("server_url", null));
                  call.resolve(ret);
              }
          }
          JAVAEOF

          cat > "$PKG_DIR/MainActivity.java" <<'JAVAEOF'
          package cz.gastris.app;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.CapConfig;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  registerPlugin(GastrisServer.class);
                  registerPlugin(VivaTerminal.class);

                  SharedPreferences prefs = getSharedPreferences("gastris", Context.MODE_PRIVATE);
                  String base = prefs.getString("server_url", null);
                  String claim = prefs.getString("claim_url", null);
                  boolean justPaired = prefs.getBoolean("just_paired", false);
                  // Studeny start bez sparovani -> www launcher (sken QR).
                  // Prvni start po sparovani (justPaired) -> nacti claim URL (s ?wt),
                  //   pak claim_url zahod, aby dalsi restarty sly na cisty origin.
                  // Bezne restarty -> cisty origin (server_url) -> auto-prihlaseni z JWT.
                  String loadUrl = null;
                  if (base != null && !base.trim().isEmpty()) {
                      if (justPaired) {
                          prefs.edit().putBoolean("just_paired", false).remove("claim_url").commit();
                          loadUrl = (claim != null && !claim.trim().isEmpty()) ? claim.trim() : base.trim();
                      } else {
                          loadUrl = base.trim();
                      }
                  }
                  if (loadUrl != null) {
                      // server.url = uzel -> jeho origin se zaregistruje jako Capacitor
                      // authority a bridge script se scope-uje na nej -> window.Capacitor
                      // je injectnute i na strance uzlu -> nativni ML Kit ctecka jede uvnitr.
                      // load() cte prave this.config (BridgeActivity), proto ho nastavime.
                      this.config = new CapConfig.Builder(this)
                              .setServerUrl(loadUrl)
                              .setAndroidScheme("https")
                              .setAllowMixedContent(true)
                              .setAllowNavigation(new String[]{
                                      "*.ts.net", "*.*.ts.net", "*.*.*.ts.net",
                                      "100.*.*.*", "192.168.*.*", "10.*.*.*", "172.16.*.*"})
                              .create();
                  }
                  super.onCreate(savedInstanceState);
              }
          }
          JAVAEOF

          cat > "$PKG_DIR/VivaTerminal.java" <<'JAVAEOF'
          package cz.gastris.app;

          import android.content.Intent;
          import android.content.ActivityNotFoundException;
          import android.net.Uri;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          // App-to-app platba kartou přes Viva.com Terminal appku (SoftPOS/Tap-to-Pay)
          // na STEJNÉM telefonu. Spustí deeplink `vivapayclient://pay/v1?action=sale...`
          // → host přiloží kartu → Viva vrátí výsledek do callback URI
          // `cz.gastris.app.viva://result?...`, který WebView zachytí přes @capacitor/app
          // appUrlOpen (manifest má pro scheme intent-filter). Párování request↔výsledek
          // přes clientTransactionId (= číslo účtu). Pro Sklípkův vlastní účet BEZ ISV
          // parametrů — Viva appka je přihlášená jeho účtem a autorizuje sama.
          @CapacitorPlugin(name = "VivaTerminal")
          public class VivaTerminal extends Plugin {

              @PluginMethod
              public void pay(PluginCall call) {
                  Double amount = call.getDouble("amount");          // v Kč
                  if (amount == null || amount <= 0) { call.reject("Neplatná částka"); return; }
                  long minor = Math.round(amount * 100);              // Viva chce haléře (minor units)
                  String ref = call.getString("reference", "");
                  boolean receipt = Boolean.TRUE.equals(call.getBoolean("showReceipt", false));
                  String callback = getContext().getPackageName() + ".viva://result";

                  StringBuilder u = new StringBuilder("vivapayclient://pay/v1")
                          .append("?action=sale")
                          .append("&amount=").append(minor)
                          .append("&appId=").append(getContext().getPackageName())
                          .append("&show_receipt=").append(receipt)
                          .append("&show_transaction_result=true");
                  if (ref != null && !ref.isEmpty()) {
                      u.append("&clientTransactionId=").append(Uri.encode(ref));
                  }
                  u.append("&callback=").append(Uri.encode(callback));

                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(u.toString()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();   // launch OK; výsledek dorazí přes appUrlOpen (callback scheme)
                  } catch (ActivityNotFoundException e) {
                      call.reject("Viva.com Terminal appka není nainstalovaná");
                  }
              }

              // Je Viva Terminal appka na telefonu? (UI schová tlačítko když ne)
              @PluginMethod
              public void isAvailable(PluginCall call) {
                  Intent probe = new Intent(Intent.ACTION_VIEW, Uri.parse("vivapayclient://pay/v1"));
                  boolean ok = probe.resolveActivity(getContext().getPackageManager()) != null;
                  JSObject r = new JSObject();
                  r.put("available", ok);
                  call.resolve(r);
              }
          }
          JAVAEOF

          echo "--- GastrisServer.java ---"; cat "$PKG_DIR/GastrisServer.java"
          echo "--- MainActivity.java ---"; cat "$PKG_DIR/MainActivity.java"
          echo "--- VivaTerminal.java ---"; cat "$PKG_DIR/VivaTerminal.java"

      - name: Patch AndroidManifest with CAMERA permission + ML Kit module auto-download
        run: |
          MANIFEST=./android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n\n    <application|' "$MANIFEST"
          fi
          # Android 11+ (API 30+) package visibility: bez <queries> appka "nevidí" jiné
          # appky → resolveActivity(vivapayclient://) vrací null → isAvailable=false i když
          # je Viva Terminal nainstalovaná. Deklarujeme schéma, ať ji smíme vidět i spustit.
          # Capacitor generuje <queries> sám → musíme vložit náš <intent> DOVNITŘ,
          # ne přidávat druhý blok (guard na "<queries" by jinak sed přeskočil).
          if ! grep -q "vivapayclient" "$MANIFEST"; then
            if grep -q "<queries>" "$MANIFEST"; then
              sed -i 's|<queries>|<queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="vivapayclient" />\n        </intent>|' "$MANIFEST"
            else
              sed -i 's|<application|<queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="vivapayclient" />\n        </intent>\n    </queries>\n\n    <application|' "$MANIFEST"
            fi
          fi
          # Google ML Kit Code Scanner modul si Play Services STÁHNE AUTOMATICKY po instalaci
          # appky (meta-data uvnitr <application>). Jinak se stahuje az pri 1. skenu -> chyba
          # 'googlebarcodescanner module is not available'. Vlozime pred prvni <activity>.
          if ! grep -q "com.google.mlkit.vision.DEPENDENCIES" "$MANIFEST"; then
            sed -i '0,/<activity/s|<activity|<meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />\n        <activity|' "$MANIFEST"
          fi
          # Callback scheme pro app-to-app platbu kartou: Viva.com Terminal vrátí výsledek
          # na cz.gastris.app.viva://result → WebView ho chytí přes @capacitor/app appUrlOpen.
          # Přidá druhý intent-filter do MainActivity (hned za MAIN/LAUNCHER; trik se
          # zavírací/otevírací značkou drží XML vyvážené).
          if ! grep -q "cz.gastris.app.viva" "$MANIFEST"; then
            sed -i 's#<category android:name="android.intent.category.LAUNCHER" />#<category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="cz.gastris.app.viva" />#' "$MANIFEST"
          fi
          echo "--- Patched manifest: ---"
          cat "$MANIFEST"

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Re-sign with consistent key (uber-apk-signer)
        # Podpis KONZISTENTNIM vlozenym debug klicem -> nova APK se nainstaluje
        # PRES predchozi bez odinstalace (Android vyzaduje stejny podpis).
        run: |
          curl -sL -o uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar uber-apk-signer.jar \
            --apks ./android/app/build/outputs/apk/debug/app-debug.apk \
            --allowResign --overwrite
          cp ./android/app/build/outputs/apk/debug/app-debug.apk ./gastris-cisnik.apk
          echo "--- Signed APK: ---"
          ls -la ./gastris-cisnik.apk

      - name: Publish APK to release (distribuce na telefony)
        # Podepsana APK jako asset release 'android' v TOMTO (verejnem) repu přes
        # vestavěný GITHUB_TOKEN — ŽÁDNÝ extra secret/PAT (Stefan 100% nezávislý).
        # Presne sem miri QR "Stahnout appku" v Nastaveni GastrISu. Release assety
        # NEjdou z kvoty Actions artefaktu. Release vytvoř, když ještě není.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # main → ostrý release 'android' (sem míří QR Stáhnout appku).
          # jiná větev (např. viva-tap-to-pay) → oddělený 'android-test' → NEpřepíše
          # živý scanner APK, Stefan si testovací APK nainstaluje ručně z linku.
          TAG="android"; TITLE="GastrIS Číšník — Android"
          if [ "${GITHUB_REF_NAME:-main}" != "main" ]; then
            TAG="android-test"; TITLE="GastrIS Číšník — TEST ($GITHUB_REF_NAME)"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
                 --title "$TITLE" \
                 --notes "Nativní Android appka GastrIS (WebView obal číšnické PWA). Aktualizuje CI při každém pushi."
          gh release upload "$TAG" ./gastris-cisnik.apk --repo "$GITHUB_REPOSITORY" --clobber
          echo "Publikovano: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/gastris-cisnik.apk"
